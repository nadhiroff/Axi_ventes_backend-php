# Apache local (Ubuntu) : active les .htaccess du backend Axi, et seulement pour ce dossier.
# Sans cela (AllowOverride None), Apache sert les fichiers internes : journaux, .git, database/…
# Installation :
#   sudo cp deploy/apache-axi.conf /etc/apache2/conf-available/axi-backend.conf
#   sudo a2enconf axi-backend && sudo systemctl reload apache2
<Directory /var/www/html/Axi_ventes_backend-php>
    AllowOverride All
    Require all granted
</Directory>
